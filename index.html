  <style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#16070c;font-family:Tahoma,"Noto Sans Thai",sans-serif}.app-frame{display:block;width:100%;height:100%;height:100dvh;border:0;background:#16070c}.ios-standalone .app-frame{position:fixed;left:0;top:env(safe-area-inset-top);height:100dvh}.loader{position:fixed;z-index:3;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 22%,#6e1d38,#2c0c17 52%,#120509);transition:opacity .35s}.loader.hide{opacity:0;pointer-events:none}.loader-card{text-align:center;color:#ffe9bb}.loader-icon{width:112px;height:112px;border-radius:27px;animation:float 3.6s ease-in-out infinite;box-shadow:0 24px 55px #050204aa,0 0 45px #d6587b44}.loader h1{margin:19px 0 4px;font-size:28px}.loader p{margin:0;color:#d8b9c2;font-size:12px}.install{position:fixed;z-index:4;right:12px;bottom:max(12px,env(safe-area-inset-bottom));border:1px solid #f5d697;border-radius:14px;padding:11px 15px;background:#fff7e8;color:#64162e;font-weight:800;box-shadow:0 12px 32px #2b071655}.install[hidden]{display:none}.line-gate{position:fixed;z-index:6;inset:0;display:none;place-items:center;padding:24px;background:radial-gradient(circle at 50% 18%,#6d1d37,#260a14 55%,#100407);color:#fff}.line-gate.show{display:grid}.line-card{width:min(100%,420px);padding:28px 22px;border:1px solid #edcf8b55;border-radius:26px;background:#2a0b15ee;text-align:center;box-shadow:0 30px 80px #0009}.line-card img{width:92px;height:92px;border-radius:23px;box-shadow:0 18px 40px #0008}.line-card h1{margin:16px 0 7px;color:#f2d391}.line-card p{color:#d5bdc5;line-height:1.65;font-size:14px}.line-card a,.line-card button{display:block;width:100%;margin-top:10px;padding:13px;border:1px solid #e6c77e;border-radius:13px;background:linear-gradient(135deg,#a63858,#701831);color:#fff;text-decoration:none;font-weight:800}.line-card button{background:#210911;color:#f2d391}.line-hint{margin-top:14px;color:#ae969e;font-size:12px;line-height:1.6}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@media(prefers-reduced-motion:reduce){.loader-icon{animation:none}}</style>

  <div id="loader" class="loader"><div class="loader-card"><img class="loader-icon" src="./icons/icon-192.png?v=4" alt=""><h1>KTH Sepsis</h1><p>SMART SEPSIS DIGITAL SCREENING</p></div></div>
  <section id="lineGate" class="line-gate"><div class="line-card"><img src="./icons/icon-192.png?v=4" alt=""><h1>KTH Sepsis</h1><p>เพื่อความปลอดภัยและป้องกันปัญหาบัญชี Google<br>กรุณาเปิดระบบด้วย Safari หรือ Chrome</p><a id="openChrome" href="#">เปิดด้วย Chrome</a><button id="copyLink" type="button">คัดลอกลิงก์ระบบ</button><div class="line-hint">iPhone/iPad: แตะเมนู ⋯ ของ LINE แล้วเลือก “เปิดใน Safari”</div></div></section>
  <iframe id="appFrame" class="app-frame" title="KTH Sepsis" allow="clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <button id="installApp" class="install" type="button" hidden>ติดตั้ง KTH Sepsis</button>
  <script>const APP_URL='https://script.google.com/macros/s/AKfycbzzxASjRijDWmgw4dNQXxiqnHdEL0JfXdpyki15i2hSzZh3baicOzd1IhqVcicDmbao/exec?v=97&embedded=1',PUBLIC_URL='https://nongmee1225.github.io/KTH-Sepsis/',EXTERNAL_URL=PUBLIC_URL+'?external=1';const frame=document.getElementById('appFrame'),loader=document.getElementById('loader'),installButton=document.getElementById('installApp'),lineGate=document.getElementById('lineGate'),params=new URLSearchParams(location.search),ua=navigator.userAgent,ref=document.referrer;const SESSION_KEY='kthSessionToken';addEventListener('message',event=>{const data=event.data||{};let trusted=false;try{const host=new URL(event.origin).hostname;trusted=event.origin==='https://script.google.com'||host==='script.google.com'||host.endsWith('.googleusercontent.com')}catch(e){}if(!trusted||data.source!=='KTH_SEPSIS_APP')return;if(data.type==='AUTH_STORE'&&data.token)localStorage.setItem(SESSION_KEY,String(data.token));else if(data.type==='AUTH_CLEAR')localStorage.removeItem(SESSION_KEY);else if(data.type==='AUTH_REQUEST'&&event.source)event.source.postMessage({source:'KTH_SEPSIS_PWA',type:'AUTH_TOKEN',token:localStorage.getItem(SESSION_KEY)||''},event.origin)});const isIOS=/iPhone|iPad|iPod/i.test(ua),isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;document.documentElement.classList.toggle('ios-standalone',isIOS&&isStandalone);const isLine=params.get('source')==='line'||/Line|LIFF/i.test(ua)||/line\.me|liff/i.test(ref);if(isLine&&params.get('external')!=='1'){loader.classList.add('hide');lineGate.classList.add('show');const openButton=document.getElementById('openChrome'),copyButton=document.getElementById('copyLink');if(/Android/i.test(ua)){openButton.href='intent://nongmee1225.github.io/KTH-Sepsis/?external=1#Intent;scheme=https;package=com.android.chrome;end'}else{openButton.hidden=true}copyButton.addEventListener('click',async event=>{try{await navigator.clipboard.writeText(EXTERNAL_URL);event.currentTarget.textContent='คัดลอกแล้ว — เปิด Safari แล้ววางลิงก์นี้'}catch(e){event.currentTarget.textContent=EXTERNAL_URL}})}else{frame.src=APP_URL;frame.addEventListener('load',()=>setTimeout(()=>loader.classList.add('hide'),350));setTimeout(()=>loader.classList.add('hide'),9000)}if('serviceWorker'in navigator){let swRefreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(swRefreshing)return;swRefreshing=true;location.reload()});navigator.serviceWorker.register('./sw.js?v=31',{updateViaCache:'none'}).then(reg=>{reg.update();setInterval(()=>reg.update(),300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update()})}).catch(()=>{})}let installPrompt;addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;installButton.hidden=false});installButton.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installButton.hidden=true});addEventListener('appinstalled',()=>{installButton.hidden=true});</script>
</body></html>
