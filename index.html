<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4a111b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KTH Sepsis">
  <meta name="mobile-web-app-capable" content="yes">
  <title>KTH Sepsis</title>
  <link rel="manifest" href="./manifest.webmanifest?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png?v=1">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=1">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #18090d; }
    body { font-family: Tahoma, "Noto Sans Thai", Arial, sans-serif; }
    .loading { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 35%, #5f1a27, #18090d 70%); color: #f9e3b2; text-align: center; }
    .loading[hidden] { display: none; }
    .loading-content { display: grid; justify-items: center; gap: 16px; }
    .loading-icon { width: 104px; height: 104px; border-radius: 23px; box-shadow: 0 16px 44px rgba(0,0,0,.45); }
    .loading-title { font-size: 22px; font-weight: 800; letter-spacing: .04em; }
    .loading-text { color: #e8c98a; font-size: 14px; }
    .browser-fallback { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 20; display: inline-flex; min-height: 42px; align-items: center; padding: 9px 13px; border: 1px solid #b88945; border-radius: 10px; background: #fff8eb; color: #48131d; box-shadow: 0 8px 24px rgba(0,0,0,.22); font: 700 13px Tahoma, Arial, sans-serif; text-decoration: none; }
    .browser-fallback[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="loading" class="loading" role="status">
    <div class="loading-content">
      <img class="loading-icon" src="./icons/icon-192.png?v=1" alt="">
      <div class="loading-title">KTH Sepsis</div>
      <div class="loading-text">กำลังเปิดระบบคัดกรอง Sepsis…</div>
    </div>
  </div>
  <a id="browserFallback" class="browser-fallback" href="#" target="_top">แตะเพื่อเปิดระบบ ↗</a>
  <script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycbzzxASjRijDWmgw4dNQXxiqnHdEL0JfXdpyki15i2hSzZh3baicOzd1IhqVcicDmbao/exec';
    const fallback = document.getElementById('browserFallback');
    fallback.href = APP_URL;
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js?v=1').catch(() => {});
    setTimeout(() => window.location.replace(APP_URL), 700);
  </script>
</body>
</html>
