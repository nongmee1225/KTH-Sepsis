  <link rel="manifest" href="./manifest.webmanifest?v=4"><link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png?v=4"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=4">
  <style>:root{--gas-banner-height:46px;color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#7e2340;font-family:Tahoma,"Noto Sans Thai",sans-serif}.app-frame{position:fixed;z-index:1;left:0;top:calc(-1 * var(--gas-banner-height));width:100%;height:calc(100dvh + var(--gas-banner-height));border:0;background:#7e2340}.loader{position:fixed;z-index:3;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 22%,#c94e70,#7f2342 48%,#421323);transition:opacity .35s}.loader.hide{opacity:0;pointer-events:none}.loader-card{text-align:center;color:#ffe9bb}.loader-icon{width:112px;height:112px;border-radius:27px;animation:float 3.6s ease-in-out infinite;box-shadow:0 24px 55px #2b071688,0 0 45px #ffc0d15c}.loader h1{margin:19px 0 4px;font-size:28px}.loader p{margin:0;color:#f3cfda;font-size:12px}.install{position:fixed;z-index:4;right:12px;bottom:max(12px,env(safe-area-inset-bottom));border:1px solid #f5d697;border-radius:14px;padding:11px 15px;background:#fff7e8;color:#64162e;font-weight:800;box-shadow:0 12px 32px #2b071655}.install[hidden]{display:none}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@media(prefers-reduced-motion:reduce){.loader-icon{animation:none}}</style>
</head><body>
  <div id="loader" class="loader"><div class="loader-card"><img class="loader-icon" src="./icons/icon-192.png?v=4" alt=""><h1>KTH Sepsis</h1><p>SMART SEPSIS DIGITAL SCREENING</p></div></div>

  <button id="installApp" class="install" type="button" hidden>ติดตั้ง KTH Sepsis</button>
  <script>const APP_URL='https://script.google.com/macros/s/AKfycbzzxASjRijDWmgw4dNQXxiqnHdEL0JfXdpyki15i2hSzZh3baicOzd1IhqVcicDmbao/exec?v=74&embedded=1';const frame=document.getElementById('appFrame'),loader=document.getElementById('loader'),installButton=document.getElementById('installApp');frame.src=APP_URL;frame.addEventListener('load',()=>setTimeout(()=>loader.classList.add('hide'),350));setTimeout(()=>loader.classList.add('hide'),9000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=6').catch(()=>{});let installPrompt;addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;installButton.hidden=false});installButton.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installButton.hidden=true});addEventListener('appinstalled',()=>{installButton.hidden=true});</script>
